spring.application.name=audit-search-service
server.port=${SERVICE_PORT:8083}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=audit-search-service-group
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankguard}
spring.datasource.username=${DB_USERNAME:bankguard}
spring.datasource.password=${DB_PASSWORD:bankguard}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

bankguard.security.jwt.secret=${JWT_SECRET:bankguard-local-development-secret-change-me}
bankguard.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
