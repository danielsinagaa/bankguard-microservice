name: bankguard

services:
  postgres:
    image: postgres:16
    container_name: bankguard-postgres
    environment:
      POSTGRES_DB: bankguard
      POSTGRES_USER: bankguard
      POSTGRES_PASSWORD: bankguard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankguard -d bankguard"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bankguard-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: bankguard-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - bankguard-network

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: bankguard-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transaction.created --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transaction.risk-scored --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transaction.created.dlq --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transaction.risk-scored.dlq --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --list
    networks:
      - bankguard-network

  redis:
    image: redis:7
    container_name: bankguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bankguard-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
    container_name: bankguard-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - bankguard-network

  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: transaction-service/target/transaction-service-0.0.1-SNAPSHOT.jar
    container_name: bankguard-transaction-service
    environment:
      SERVICE_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/bankguard
      DB_USERNAME: bankguard
      DB_PASSWORD: bankguard
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: bankguard-local-development-secret-change-me
    ports:
      - "${TRANSACTION_HOST_PORT:-18081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - bankguard-network

  risk-engine-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: risk-engine-service/target/risk-engine-service-0.0.1-SNAPSHOT.jar
    container_name: bankguard-risk-engine-service
    environment:
      SERVICE_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/bankguard
      DB_USERNAME: bankguard
      DB_PASSWORD: bankguard
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${RISK_ENGINE_HOST_PORT:-18082}:8082"
    depends_on:
      transaction-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - bankguard-network

  audit-search-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: audit-search-service/target/audit-search-service-0.0.1-SNAPSHOT.jar
    container_name: bankguard-audit-search-service
    environment:
      SERVICE_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/bankguard
      DB_USERNAME: bankguard
      DB_PASSWORD: bankguard
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      JWT_SECRET: bankguard-local-development-secret-change-me
    ports:
      - "${AUDIT_SEARCH_HOST_PORT:-18083}:8083"
    depends_on:
      transaction-service:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - bankguard-network

  master-data-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: master-data-service/target/master-data-service-0.0.1-SNAPSHOT.jar
    container_name: bankguard-master-data-service
    environment:
      SERVICE_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/bankguard
      DB_USERNAME: bankguard
      DB_PASSWORD: bankguard
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: bankguard-local-development-secret-change-me
    ports:
      - "${MASTER_DATA_HOST_PORT:-18084}:8084"
    depends_on:
      transaction-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - bankguard-network

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:

networks:
  bankguard-network:
    driver: bridge
