spring.application.name=master-data-service
server.port=${SERVICE_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankguard}
spring.datasource.username=${DB_USERNAME:bankguard}
spring.datasource.password=${DB_PASSWORD:bankguard}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

bankguard.security.jwt.secret=${JWT_SECRET:bankguard-local-development-secret-change-me}
bankguard.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
