spring.application.name=transaction-service
server.port=${SERVICE_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankguard}
spring.datasource.username=${DB_USERNAME:bankguard}
spring.datasource.password=${DB_PASSWORD:bankguard}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

bankguard.security.jwt.secret=${JWT_SECRET:bankguard-local-development-secret-change-me}
bankguard.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
